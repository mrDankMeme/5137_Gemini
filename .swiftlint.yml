opt_in_rules:
  - empty_count
  - closure_spacing
  - first_where
  - contains_over_filter_is_empty
  - shorthand_optional_binding
  - redundant_nil_coalescing

disabled_rules:
  - identifier_name
  - trailing_whitespace
  - multiple_closures_with_trailing_closure
  - force_cast
  - force_unwrapping
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - type_body_length

excluded:
  - Pods
  - DerivedData
  - build
  - .design

line_length: 150

type_name:
  min_length: 2

function_parameter_count:
  warning: 8
